{# Mensajes de messages.success / messages.error que dejan las vistas #}
{% for mensaje in messages %}
  <div class="alert {% if mensaje.tags == 'error' %}alert-danger{% else %}alert-success{% endif %} alert-dismissible rounded-0" role="alert">
    {{ mensaje }}
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
  </div>
{% endfor %}
