<header class="barra d-flex justify-content-between align-items-center">
  <a class="marca" href="{% url 'inicio' %}">Gestor Tienda</a>

  <div class="d-flex align-items-center gap-3">
    <span>{{ user.get_full_name|default:user.username }}</span>
    <span class="etiqueta-rol">{{ user.get_usu_rol_display }}</span>

    {# El logout va por POST, por eso es un formulario y no un enlace #}
    <form action="{% url 'usuarios:logout' %}" method="post" class="m-0">
      {% csrf_token %}
      <button type="submit" class="btn btn-sm btn-linea">Salir</button>
    </form>
  </div>
</header>
